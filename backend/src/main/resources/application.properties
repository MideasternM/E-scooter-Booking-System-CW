# Jackson Date Format Configuration
# 强制所有 Date 类型序列化为 ISO-8601 格式 (带时区)
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
# 禁用将 Date 对象序列化为时间戳 (数字)
